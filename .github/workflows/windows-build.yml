name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Portable Catalyst.exe (MSVC)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      # Fast checks first so type errors fail in a minute or two, before the long build.
      - name: Svelte and TypeScript check
        run: npm run check

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --no-default-features --all-targets

      # Release builds use --no-default-features so the unlicensed QA (mcp) plugin is not compiled in.
      # Updater artifacts need a signing key, so tauri.build-check.conf.json turns them off.
      - name: Build portable exe
        run: npx tauri build --no-bundle -c src-tauri/tauri.build-check.conf.json -- --no-default-features
        shell: bash

      - name: Upload Catalyst.exe
        uses: actions/upload-artifact@v4
        with:
          name: Catalyst-windows-x64-${{ github.sha }}
          path: src-tauri/target/release/catalyst.exe
          if-no-files-found: error

      # Windows-only file behavior (ReplaceFileW, long paths, demo staging) is
      # covered by #[cfg(windows)] tests that only run here.
      - name: Windows document, demo and campaign tests
        working-directory: src-tauri
        run: cargo test --no-default-features --lib -- "document::" sample_project campaign_wizard rpg_import
