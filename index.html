<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalyst</title>
    <!-- Render startup feedback before the application module is available. -->
    <link rel="stylesheet" href="/src/startup.css" />
    <script>
      // Apply theme before first paint to prevent flash
      (function () {
        var t = localStorage.getItem("catalyst:theme");
        var legacy = ["lithomark:theme", "kindling:theme"];
        for (var i = 0; !t && i < legacy.length; i++) {
          t = localStorage.getItem(legacy[i]);
          if (t) {
            localStorage.setItem("catalyst:theme", t);
            localStorage.removeItem(legacy[i]);
          }
        }
        t = t || "dark";
        if (t === "system")
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="app" class="press-app" inert aria-busy="true"></div>
    <div id="startup-loading" role="status" aria-live="polite">
      <span class="startup-spinner" aria-hidden="true"></span>
      <span id="startup-message">Starting Catalyst…</span>
      <button id="startup-retry" type="button" hidden>Try again</button>
    </div>
    <script type="module" src="/src/startup.ts"></script>
  </body>
</html>
